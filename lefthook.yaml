pre-commit:
  parallel: true
  commands:
    format:
      root: .
      glob: '*.{ts,tsx,js,jsx,mjs,css,json}'
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true

    lint:
      root: .
      glob: '*.{ts,tsx}'
      run: pnpm exec biome lint --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    lint-commit-message:
      run: pnpm commitlint --edit {1}
